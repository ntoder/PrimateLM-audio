# MkDocs configuration for the PrimateLM-audio project site.
# Structure modelled on the NatureLM-audio docs (Material for MkDocs).
site_name: PrimateLM-audio
site_description: A small, honest primate-vocalization classifier — docs, demo and robot hook
site_url: https://ntoder.github.io/PrimateLM-audio/

repo_name: ntoder/PrimateLM-audio
repo_url: https://github.com/ntoder/PrimateLM-audio
edit_uri: ""

docs_dir: docs

nav:
  - Getting Started:
      - Overview: index.md
      - Usage: usage.md
      - Quick Start: quick_start.md
  - Demos & Examples:
      - Interactive Demo: demo.md
      - Examples: examples.md
      - Robot Integration: robot.md
  - Reference:
      - Datasets: datasets.md
      - How It Works: how_it_works.md
      - Team: team.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - toc:
      title: On this page
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
